name: Ravintoloiden ja tekemisen syyt

# Hakee viikoittain syyt joiden takia ravintola tai tekemispaikka nousee sivun
# kärkeen: Michelin-opas, Suomen 50 parasta, Vuoden ravintola, Time Out
# Helsinki, tuoreet anniskeluluvat, museoiden näyttelykalenteri (museot.fi)
# ja tekemisen toimituslistat. Kirjoittaa data/restaurant-reasons.json ja
# data/activity-reasons.json ja committoi ne suoraan mainiin, jolloin Vercel
# julkaisee muutoksen itsestään.
#
# MIKSI SUORA COMMIT EIKÄ PR. Omistaja pyysi automaatiota joka päivittää
# etusivun itse. Pull request vaatisi ihmisen painamaan nappia joka viikko,
# eli juuri sen käsityön joka haluttiin pois. Turvana on kolme porttia:
#
#   1. Skripti kieltäytyy kirjoittamasta jos yksikin lähde alittaa alarajansa
#      (ks. FLOOR scripts/fetch-restaurant-reasons.ts:ssä). Hiljainen romahdus
#      on pahin vika mitä tälle sovellukselle voi tapahtua.
#   2. Testit ajetaan UUTTA tiedostoa vasten ennen committia — ne tarkistavat
#      sekä rakenteen että lähdekohtaiset vähimmäismäärät.
#   3. Muutos on gitissä ennen kuin se on tuotannossa, joten sen näkee diffistä
#      ja voi perua yhdellä revertillä.
#
# Kaikki lähteet ovat avoimia ja tarkistettu robots.txt:stä; katso perustelut
# scripts/fetch-restaurant-reasons.ts:n alusta. Ei vaadi salaisuuksia.

on:
  schedule:
    # Maanantai 05:00 UTC = 08:00 Helsingissä. Ennen korjausagenttia (06:00),
    # jotta kaksi jobia ei kirjoita samaan repoon yhtä aikaa.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restaurant-reasons
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Asenna riippuvuudet
        run: npm ci

      # PORTTI 1 — skripti pysähtyy itse jos jokin lähde on romahtanut.
      - name: Hae ravintoloiden syyt
        run: npx tsx scripts/fetch-restaurant-reasons.ts

      # Tekemisen syyt: näyttelyt, toimituslistat, OSM:n uudet vapaa-ajan
      # paikat. Omat FLOOR-alarajat kuten ravintolahaussa — EI
      # continue-on-error, koska tiedosto on tekemistä-kärjen selkäranka.
      - name: Hae tekemisen syyt
        run: npx tsx scripts/fetch-activity-reasons.ts

      # Juuri avatut, joita OSM ei vielä tunne: haetaan niille kuva ja
      # koordinaatit Googlesta. Maksaa vain uusista — jo haetut ovat tiedostossa
      # eikä niitä kysytä uudelleen. Jos tämä kaatuu (esim. tunnus vanhentunut),
      # syyt on jo haettu ja ne committoidaan silti: uutuuskortit ovat lisä,
      # eivät edellytys.
      - name: Hae uudet avaukset
        continue-on-error: true
        env:
          DATAFORSEO_TOKEN: ${{ secrets.DATAFORSEO_TOKEN }}
          # Kuvien kotiutus omaan varastoon (lib/kuvavarasto) — ilman näitä
          # kuvat jäisivät lahoaviksi lainalinkeiksi.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/fetch-new-openings.ts

      # OSM:n uusien paikkojen Google-kortit (kuva, osoite, arvosana) Uutta
      # Helsingissä -sivulle. Maksaa vain uusista — jo haetut ovat tiedostossa.
      # Kaatuminen ei estä muuta: rivit näkyvät silloin ilman korttia.
      - name: Rikasta uudet paikat
        continue-on-error: true
        env:
          DATAFORSEO_TOKEN: ${{ secrets.DATAFORSEO_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/enrich-new-places.ts

      # Kirpputorit ja second hand -liikkeet OSM:stä /kirpputorit-sivulle.
      # Ilmainen; oma romahdusvahti skriptissä.
      - name: Hae second hand -liikkeet
        continue-on-error: true
        run: npx tsx scripts/fetch-secondhand.ts

      # Tapahtumapaikkojen omat kotisivut LinkedEventsin place-rekisteristä.
      # Käytetään infopaneelissa kun tapahtumalla ei ole omaa lippu-/järjestäjä-
      # linkkiä — ilman tätä paneeli tarjoaisi vain hakunapin. Ilmainen,
      # avointa Helsinki-dataa; oma alaraja (FLOOR) skriptissä.
      - name: Hae paikkojen kotisivut
        continue-on-error: true
        run: npx tsx scripts/fetch-venue-sites.ts

      # Saunojen Google-kortit /saunat-sivulle. Maksaa vain uusista ja
      # 60 pv välein virkistettävistä.
      - name: Hae saunakortit
        continue-on-error: true
        env:
          DATAFORSEO_TOKEN: ${{ secrets.DATAFORSEO_TOKEN }}
        run: npx tsx scripts/fetch-sauna-cards.ts

      # Nettisivujen esittelykuvat: ravintolan itse valitsema jakokuva omalta
      # sivultaan — ei lahoa kuten Googlen linkit, ilmainen. Lukee tuotannon
      # ravintolalistan, joten ei tarvitse salaisuuksia.
      - name: Hae nettisivujen kuvat
        continue-on-error: true
        run: npx tsx scripts/fetch-website-images.ts

      # Kuolleiden kuvien haravointi: Googlen kuvaosoitteet lahoavat (mitattu
      # 49 % kuolleita kuuden viikon jälkeen). Ilmainen — pelkkiä HTTP-
      # tarkistuksia. Epäonnistuminen ei estä syiden päivitystä.
      - name: Haravoi kuolleet kuvat
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/sweep-dead-images.ts

      - name: Onko muutoksia?
        id: diff
        run: |
          if git diff --quiet -- data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Ei muutoksia."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- data/
          fi

      # PORTTI 2 — testit ja tyypit ajetaan UUTTA dataa vasten. Testit lukevat
      # data/restaurant-reasons.json:n ja tarkistavat lähdekohtaiset alarajat,
      # joten rikkinäinen haku ei pääse committiin vaikka skripti olisi päästänyt.
      - name: Tarkista tyypit ja testit
        if: steps.diff.outputs.changed == 'true'
        run: |
          npx tsc --noEmit
          npx tsx scripts/test-categories.ts

      # PORTTI 3 — vain tämä yksi tiedosto committoidaan. Ei `git add .`.
      - name: Committoi
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/restaurant-reasons.json data/activity-reasons.json data/new-openings.json data/new-places-enriched.json data/sauna-cards.json data/secondhand.json data/dead-images.json data/website-images.json data/venue-sites.json
          git commit -m "Reasons: weekly refresh (restaurants + activities)

          Automaattinen haku: Michelin-opas, Suomen 50 parasta, Vuoden
          ravintola, Time Out Helsinki, anniskelulupa*rekisteri, juuri
          avattujen kortit Googlesta, museoiden näyttelykalenteri ja
          tekemisen toimituslistat.
          Ks. scripts/fetch-restaurant-reasons.ts, fetch-new-openings.ts
          ja fetch-activity-reasons.ts"
          git push
